name: Build MCtrainerPlus 2.2.1

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip archive
        run: for f in *.zip; do unzip -o "$f"; done
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn clean package
      - name: Publish JAR to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.1
          files: target/MCtrainerPlus-2.2.1.jar
